<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Fajar Responses ❤️</title>

<link rel="stylesheet" href="style.css">

<style>

.admin-page {

    min-height: 100vh;

    padding: 40px 20px;

}


.admin-container {

    width:
        min(900px,100%);

    margin: auto;

}


.admin-header {

    text-align: center;

    margin-bottom: 35px;

}


.admin-header h1 {

    font-size:
        clamp(35px,7vw,60px);

    color: #ff5b91;

    text-shadow:
        0 0 25px
        rgba(255,60,120,.4);

}


.admin-header p {

    color: #bd8b9b;

}


.status {

    text-align: center;

    margin-bottom: 25px;

    color: #c58b9e;

}


.response {

    padding: 25px;

    margin-bottom: 18px;

    border-radius: 20px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.08),
            rgba(255,20,90,.04)
        );

    border:
        1px solid
        rgba(255,255,255,.1);

    backdrop-filter:
        blur(15px);

    animation:
        appear .4s ease;

}


.accepted {

    border-left:
        5px solid #ff4f8b;

}


.rejected {

    border-left:
        5px solid #777;

}


.response-title {

    font-size: 21px;

    font-weight: 700;

}


.response-value {

    margin-top: 10px;

    color: #f5dce5;

}


.response-time {

    margin-top: 10px;

    color: #a98291;

    font-size: 13px;

}


.empty {

    text-align: center;

    padding: 45px;

    color: #a98291;

}


.error {

    text-align: center;

    padding: 30px;

    color: #ff719c;

}


@keyframes appear {

    from {

        opacity: 0;

        transform:
            translateY(15px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}

</style>

</head>


<body>


<div class="admin-page">

<div class="admin-container">


<div class="admin-header">

    <h1>
        💌 FAJAR'S RESPONSES
    </h1>

    <p>
        Rahul's Private Sorry Dashboard ❤️
    </p>

</div>


<div
    id="status"
    class="status">

    Checking Fajar's response...

</div>


<div
    id="responses">

</div>


</div>

</div>



<script>


// =================================================
// SAME GOOGLE APPS SCRIPT URL
// =================================================

const GOOGLE_SCRIPT_URL =
    "PASTE_YOUR_GOOGLE_SCRIPT_URL_HERE";


// =================================================
// LOAD RESPONSES
// =================================================

async function loadResponses() {

    const status =
        document.getElementById("status");

    const container =
        document.getElementById("responses");


    try {

        const result =
            await fetch(
                GOOGLE_SCRIPT_URL
            );


        const data =
            await result.json();


        container.innerHTML =
            "";


        if (
            !data ||
            data.length === 0
        ) {

            status.innerHTML =
                "💗 Waiting for Fajar...";


            container.innerHTML = `

                <div class="empty">

                    🥺 Abhi Fajar ne
                    koi response nahi diya.

                </div>

            `;

            return;

        }


        status.innerHTML =
            `💗 ${data.length} response received`;


        // Latest first

        data.reverse();


        data.forEach(
            function(item) {


                const accepted =
                    item.response ===
                    "ACCEPTED ❤️";


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "response " +
                    (
                        accepted
                        ? "accepted"
                        : "rejected"
                    );


                let time =
                    item.time;


                try {

                    time =
                        new Date(
                            item.time
                        ).toLocaleString();

                } catch(error) {

                    // Keep original time

                }


                card.innerHTML = `

                    <div
                        class="response-title">

                        ${
                            accepted

                            ? "💗 FAJAR ACCEPTED YOUR SORRY!"

                            : "😤 FAJAR IS STILL ANGRY!"
                        }

                    </div>


                    <div
                        class="response-value">

                        ${item.response}

                    </div>


                    <div
                        class="response-time">

                        🕐 ${time}

                    </div>

                `;


                container.appendChild(
                    card
                );

            }
        );


    } catch(error) {

        console.error(error);


        status.innerHTML =
            "❌ Could not connect to response server.";


        container.innerHTML = `

            <div class="error">

                Check your Google Apps Script URL.

            </div>

        `;

    }

}


// First load

loadResponses();


// Automatically update every 5 seconds

setInterval(
    loadResponses,
    5000
);

</script>


</body>

</html>
